<body class="card-page">
  <div class="card-shell">
    <p class="back"><a href="index.html">Kembali ke ucapan</a></p>
    <h1>Kartu QR</h1>
    <p class="hero-note">Simpan gambar ini, lalu kirim lewat WhatsApp. Begitu di-scan, halaman ucapannya terbuka.</p>
    <canvas id="card-canvas" role="img" aria-label="Kartu QR berbentuk hati untuk ucapan ulang tahun Sumala"></canvas>
    <p class="url-note" id="url-note" hidden>
      Alamat di kartu ini masih contoh. Ganti <code>siteUrl</code> di <code>config.js</code> dengan link website yang sudah diunggah, lalu simpan ulang gambarnya.
    </p>
    <button class="btn" id="save-card" type="button">Simpan gambar</button>
  </div>
  <script src="vendor/qrcode.js"></script>
  <script src="qr-heart.js?v=7"></script>
  <script src="config.js"></script>
  <script src="kartu.js"></script>
